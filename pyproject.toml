[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "brokerage-lab"
version = "0.1.0"
description = "Independent investment order reliability POC"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.12,<3", "pydantic-settings>=2.7,<3", "fastapi>=0.115,<1",
  "SQLAlchemy>=2.0,<2.1", "psycopg[binary]>=3.2,<4", "alembic>=1.14,<2",
  "uvicorn>=0.34,<1", "httpx>=0.28,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# Avoid verbose driver tracebacks that can expose connection credentials.
addopts = "--tb=short"
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["postgres: requires PostgreSQL; enabled with --postgres"]


[tool.setuptools.package-data]
brokerage_lab = ["templates/*.html"]
