name: Verify

on: [push, pull_request]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: brokerage
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: brokerage_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U brokerage -d brokerage_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://brokerage:ci-only-password@localhost:5432/brokerage_test
      TEST_DATABASE_URL: postgresql+psycopg://brokerage:ci-only-password@localhost:5432/brokerage_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements/*.txt
      - run: python -m pip install -r requirements/dev.txt
      - run: python -m pip install --no-deps -e .
      - run: python -m pip check
      - run: ruff check .
      - run: ruff format --check .
      - run: alembic upgrade head
      - run: alembic check
      - run: python -m pytest --postgres -q
