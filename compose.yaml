name: brokerage-lab

x-app-env: &app-env
  APP_ENV: development
  DATABASE_URL: postgresql+psycopg://brokerage_app:${APP_DATABASE_PASSWORD:?Set APP_DATABASE_PASSWORD in .env}@db:5432/brokerage_lab
  DEMO_API_KEY: ${DEMO_API_KEY:?Set DEMO_API_KEY in .env}
  OTHER_DEMO_API_KEY: ${OTHER_DEMO_API_KEY:?Set OTHER_DEMO_API_KEY in .env}
  OPERATOR_API_KEY: ${OPERATOR_API_KEY:?Set OPERATOR_API_KEY in .env}
  PARTNER_API_KEY: ${PARTNER_API_KEY:?Set PARTNER_API_KEY in .env}
  PARTNER_URL: http://partner:8001

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: brokerage
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: brokerage_lab
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brokerage -d brokerage_lab"]
      interval: 2s
      timeout: 3s
      retries: 30

  partner-db:
    image: postgres:17
    environment:
      POSTGRES_USER: partner
      POSTGRES_PASSWORD: ${PARTNER_DB_PASSWORD:?Set PARTNER_DB_PASSWORD in .env}
      POSTGRES_DB: partner_lab
    volumes: ["partner_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U partner -d partner_lab"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    image: brokerage-lab-local
    build:
      context: .
      target: runtime
    command: ["python", "-m", "brokerage_lab.bootstrap"]
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://brokerage:${POSTGRES_PASSWORD}@db:5432/brokerage_lab
      APP_DATABASE_PASSWORD: ${APP_DATABASE_PASSWORD}
    depends_on:
      db:
        condition: service_healthy

  partner:
    image: brokerage-lab-local
    build:
      context: .
      target: runtime
    command: ["sh", "-c", "alembic -c partner-alembic.ini upgrade head && exec uvicorn brokerage_lab.partner:create_app --factory --host 0.0.0.0 --port 8001"]
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://partner:${PARTNER_DB_PASSWORD}@partner-db:5432/partner_lab
      PARTNER_API_KEY: ${PARTNER_API_KEY}
    ports: ["127.0.0.1:8001:8001"]
    depends_on:
      partner-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)"]
      interval: 3s
      timeout: 4s
      retries: 20

  api:
    image: brokerage-lab-local
    build:
      context: .
      target: runtime
    command: ["uvicorn", "brokerage_lab.api:create_app", "--factory", "--reload", "--reload-dir", "/app/src", "--host", "0.0.0.0", "--port", "8000"]
    volumes:
      - ./src:/app/src:ro
      - ./migrations:/app/migrations
    environment: *app-env
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      partner:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 3s
      timeout: 4s
      retries: 20

  worker:
    image: brokerage-lab-local
    command: ["python", "-m", "brokerage_lab.worker"]
    environment: *app-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      partner:
        condition: service_healthy

  tests:
    command: ["sh", "-c", "ruff check . && ruff format --check . && python -m pytest --postgres -q"]
    profiles: ["tools"]
    build:
      context: .
      target: test
    environment:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://brokerage:${POSTGRES_PASSWORD}@db:5432/brokerage_lab
      TEST_DATABASE_URL: postgresql+psycopg://brokerage:${POSTGRES_PASSWORD}@db:5432/brokerage_lab
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  partner_data:
